<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Яблоневый сад · To be</title><style>
*{box-sizing:border-box}body{margin:0;background:#fbf4df;color:#243e32;font-family:Nunito,"Trebuchet MS",Arial,sans-serif}main{max-width:1180px;margin:auto;padding:clamp(14px,3vw,38px)}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font: bold clamp(32px,5vw,64px)/1 Georgia,serif;letter-spacing:-.05em;margin:10px 0 12px}.tag{color:#89632c;font-weight:bold;letter-spacing:.13em;font-size:12px}.count{background:#fffaf0;border:1px solid #dccdaa;border-radius:40px;padding:12px 18px;font-weight:bold;white-space:nowrap}p{font-size:clamp(15px,2vw,20px);margin:0 0 20px}.scene{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(#9cdded,#fff2ca 77%,#d2dda4);isolation:isolate}.land{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.trees{display:flex;align-items:end;padding:26px 1% 14px}.tree{width:33.333%;padding:0;background:none;border:0;cursor:pointer}.tree svg,.fruit svg{width:100%;display:block;overflow:visible}.tree:hover{filter:brightness(1.045)}button:focus-visible{outline:4px solid #215aaf;outline-offset:-4px;border-radius:16px}.shelf{margin-top:12px;background:#fffcf2;border:1px solid #e4d6b4;border-radius:24px;text-align:center;padding:15px 10px}.fruits{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(4px,1.4vw,19px)}.fruit{border:2px solid transparent;background:none;width:clamp(56px,9vw,108px);padding:3px;cursor:pointer;border-radius:18px;transition:transform .2s}.fruit:hover,.chosen{transform:translateY(-4px)}.chosen{background:#ffebaf;border-color:#d49625}.fruit:disabled{opacity:.18;transform:none;cursor:default}.status{margin:10px 0 2px;min-height:1.4em;font-weight:bold}.again{background:#235b3f;color:white;font:inherit;font-weight:bold;border:0;padding:12px 22px;border-radius:30px;cursor:pointer;margin:10px}.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.25);opacity:.2}70%{transform:scale(1.12)}}@media(max-width:560px){.trees{padding:38px 0 12px}.count{font-size:12px;padding:8px}.shelf{padding:12px 5px}.scene{border-radius:18px}.fruit{width:20%}main{padding:12px}.tag{font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
<main><header><div><div class="tag">АНГЛИЙСКИЙ · TO BE</div><h1>Яблоневый сад</h1></div><div class="count"><span id="roundLabel"></span> · <span id="score">0 / 7</span></div></header><p>Нажми на яблоко, а затем на дерево с подходящей формой глагола.</p>
<div class="scene"><svg class="land" viewBox="0 0 1100 340" preserveAspectRatio="none" aria-hidden="true"><circle cx="965" cy="52" r="31" fill="#ffdf85"/><g fill="#fffcdf" opacity=".8"><path d="M30 66q3-15 24-14 13-33 44-14 20-5 29 15 21 0 26 13Z"/><path d="M505 33q5-13 22-11 20-29 47-7 20-1 29 18Z"/></g><path d="M0 210Q220 110 475 209T900 180Q1000 145 1100 152V340H0" fill="#a9ca94"/><path d="M0 234Q280 180 590 224T1100 192V340H0" fill="#85b886"/><path d="M0 265Q235 217 515 252T1100 222V340H0" fill="#bddb80"/><g id="flowers"></g></svg><div class="trees" id="trees"></div></div>
<div class="shelf"><div class="fruits" id="fruits"></div><p class="status" id="msg" aria-live="polite">Выбери любое яблоко.</p><button class="again" hidden id="again">Играть ещё раз</button></div></main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="fruitColor" cx=".32" cy=".23" r=".83"><stop stop-color="#ffad65"/><stop offset=".38" stop-color="#ff6554"/><stop offset=".81" stop-color="#db333b"/><stop offset="1" stop-color="#a82436"/></radialGradient><linearGradient id="bark"><stop stop-color="#875236"/><stop offset=".47" stop-color="#be8250"/><stop offset="1" stop-color="#74432f"/></linearGradient><g id="apple"><path d="M0-18q0-12 6-18" stroke="#714328" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M2-24q8-17 23-12-4 15-23 12" fill="#408249"/><path d="M0-19C-31-37-36-4-23 18Q-15 34-2 29Q9 35 19 25C41-1 32-32 10-23Z" fill="url(#fruitColor)" stroke="var(--rim)" stroke-width="1.3"/><path d="M-21-8q0-7 7-10" fill="none" stroke="#fff3c2" stroke-width="4" stroke-linecap="round"/></g></defs></svg>
<script>
const pairs={I:'am',he:'is',she:'is',it:'is',you:'are',we:'are',they:'are'}, verbs=['am','is','are'];let selected=null,placed={};
const el=id=>document.getElementById(id), words=Object.keys(pairs);
const palettes=[
 {name:'Жёлтые',stops:['#fff5a2','#ffdf48','#f8b523','#da8716'],rim:'#bd851c',ink:'#75501a'},
 {name:'Зелёные',stops:['#eaff9c','#afe350','#6ab52f','#3a872c'],rim:'#4b8c29',ink:'#335b20'},
 {name:'Красные',stops:['#ffad65','#ff6554','#db333b','#a82436'],rim:'#b7373c',ink:'#873234'}
];
let round=0,previousOrder=[];
function shuffleWords(){
 const order=[...words];
 for(let i=order.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [order[i],order[j]]=[order[j],order[i]];
 }
 if(order.every((w,i)=>w===previousOrder[i]))order.push(order.shift());
 previousOrder=order;
 return order;
}
function setRound(){
 const palette=palettes[round];
 document.querySelectorAll('#fruitColor stop').forEach((stop,i)=>stop.setAttribute('stop-color',palette.stops[i]));
 document.documentElement.style.setProperty('--rim',palette.rim);
 document.documentElement.style.setProperty('--ink',palette.ink);
 el('roundLabel').textContent='Раунд '+(round+1)+' из 3';
 el('again').textContent=round===2?'Играть ещё раз':'Следующий раунд';
}
function apple(w,x,y,s,animate=false){return '<g transform="translate('+x+' '+y+') scale('+s+')"><g class="'+(animate?'pop':'')+'"><use href="#apple"/><text y="10" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="22" font-weight="bold" fill="white" stroke="var(--ink)" stroke-width="2" paint-order="stroke">'+w+'</text></g></g>'}
function leaf(x,y,a,c){return '<path transform="translate('+x+' '+y+') rotate('+a+')" d="M0 0Q-15-3-14-18Q1-17 0 0" fill="'+c+'"/>'}
function draw(v,last){const i=verbs.indexOf(v),ws=Object.keys(placed).filter(w=>placed[w]===v),fraction=ws.length/(i?3:1);
let crown='';for(let k=0;k<22;k++){let a=k*Math.PI/11,r=17+4*Math.sin(k*4+i),x=130+91*Math.cos(a),y=99+65*Math.sin(a);crown+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#75a65c"/>'}crown+='<ellipse cx="130" cy="96" rx="94" ry="69" fill="#75a65c"/>';
for(let k=0;k<14;k++){let a=k*Math.PI/7;crown+='<circle cx="'+(126+76*Math.cos(a))+'" cy="'+(88+52*Math.sin(a))+'" r="21" fill="#9bc568"/>'}crown+='<ellipse cx="126" cy="88" rx="83" ry="59" fill="#9bc568"/>';
let leaves='';for(let k=0;k<54;k++){let a=k*2.4+i,r=Math.sqrt((k+.6)/54),x=130+93*r*Math.cos(a),y=93+68*r*Math.sin(a);leaves+=leaf(x,y,40*Math.sin(k),k%3?'#32804b':'#e1e97c')+leaf(x,y,100+22*Math.sin(k),'#5caa47')}
const slots=i?[[130,59],[85,119],[175,119]]:[[130,95]];
return '<svg viewBox="0 0 260 255"><ellipse cx="130" cy="241" rx="69" ry="8" fill="#58834b" opacity=".28"/><path d="M101 241q16-31 12-75l-36-42 10-5 36 32 12-60 9 5-3 53 39-30 7 7-45 44q-2 47 20 71-29-9-61 0" fill="url(#bark)"/>'+crown+'<g opacity="'+(.19+.81*fraction)+'">'+leaves+'</g>'+slots.map(([x,y],j)=>ws[j]?apple(ws[j],x,y,.78,ws[j]===last):'<circle cx="'+x+'" cy="'+y+'" r="19" fill="#e5efb2" opacity=".67" stroke="#577c43" stroke-dasharray="3 4" stroke-width="2"/>').join('')+'<rect x="88" y="184" width="84" height="41" rx="10" fill="#78442c" stroke="#f2c278" stroke-width="3"/><text x="130" y="214" text-anchor="middle" fill="#fff6d9" font-size="33" font-weight="bold">'+v+'</text></svg>'}
function pick(v){if(!selected){el('msg').textContent=Object.keys(placed).length===7?'Все яблоки на ветках!':'Сначала выбери яблоко.';return}if(pairs[selected]!==v){el('msg').textContent='Попробуй другое дерево для «'+selected+'».';return}const w=selected;placed[w]=v;selected=null;const n=Object.keys(placed).length;el('score').textContent=n+' / 7';el('msg').textContent=(n===7?(round===2?'Все три раунда пройдены! Последняя пара — ':'Раунд пройден! Последняя пара — '):'Верно! ')+w+' '+v+'.';el('again').hidden=n!==7;document.querySelector('[data-tree="'+v+'"]').innerHTML=draw(v,w);update()}
function update(){document.querySelectorAll('.fruit').forEach(b=>{b.disabled=!!placed[b.value];b.classList.toggle('chosen',selected===b.value);b.setAttribute('aria-pressed',String(selected===b.value))})}
function start(){setRound();selected=null;placed={};el('fruits').replaceChildren();el('trees').replaceChildren();el('score').textContent='0 / 7';el('msg').textContent='Выбери любое яблоко.';el('again').hidden=true;for(const v of verbs){let b=document.createElement('button');b.className='tree';b.dataset.tree=v;b.setAttribute('aria-label','Дерево '+v);b.innerHTML=draw(v);b.onclick=()=>pick(v);el('trees').append(b)}for(const w of shuffleWords()){let b=document.createElement('button');b.className='fruit';b.value=w;b.setAttribute('aria-label','Яблоко '+w);b.innerHTML='<svg viewBox="0 0 78 79">'+apple(w,39,41,1)+'</svg>';b.onclick=()=>{selected=w;update();el('msg').textContent='Какое дерево подходит к «'+w+'»?'};el('fruits').append(b)}update()}
let meadow='';for(let i=0;i<64;i++){let x=(i*173)%1100,y=290+(i*31)%50;meadow+='<g transform="translate('+x+' '+y+')"><path d="M0 0q-5-6-4-9M0 0q3-9 6-11" stroke="#7dab61" fill="none"/>'+(i%4?'':'<circle cy="-10" r="4" fill="#fff7d4"/><circle cy="-10" r="1.7" fill="#f4b442"/>')+'</g>'}el('flowers').innerHTML=meadow;el('again').onclick=()=>{if(Object.keys(placed).length!==words.length)return;round=(round+1)%palettes.length;start()};start();
</script></html>
